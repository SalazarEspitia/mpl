name: Linux evidence

# Builds MPL at each commit the pack uses, on each platform, then runs each finding and puts the results
# in the run's summary: one table per finding and platform, and at the end one table per finding with a
# column per platform. Reruns happen by pushing to this branch.
#
# Linux: one job per build and one per finding, in parallel. macOS: two jobs in all (every build, then every
# finding, one after the other), because GitHub runs only a few macOS jobs at a time and the rest wait
# in the queue until they are cancelled.

on:
  push:
    branches: [linux-evidence]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.ref }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # MPL's README names Linux x86-64 and macOS; Linux on Arm is an experiment here, so it may fail.
    continue-on-error: ${{ matrix.os == 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        ref: [base, weak, weak0, hint, main, ebr]
    steps:
      - name: Checkout the pack
        uses: actions/checkout@v4

      - name: Find the commit
        id: ref
        run: |
          . common/refs.sh
          echo "commit=$(ref_commit '${{ matrix.ref }}')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache the build
        id: cache
        uses: actions/cache@v4
        with:
          path: .builds/${{ steps.ref.outputs.commit }}
          key: mpl-${{ matrix.os }}-${{ steps.ref.outputs.image }}-${{ runner.arch }}-${{ steps.ref.outputs.commit }}

      - name: Install dependencies (Linux x86-64, as upstream's ci.yml)
        if: steps.cache.outputs.cache-hit != 'true' && runner.arch == 'X64'
        run: |
          sudo apt-get update
          sudo apt-get install -y mlton libgmp-dev gcc make

      # Ubuntu has no arm64 package of MLton, so on Arm it comes from MLton's own release.
      - name: Install dependencies (Linux Arm, MLton from its release)
        if: steps.cache.outputs.cache-hit != 'true' && runner.arch == 'ARM64'
        env:
          MLTON_URL: https://github.com/MLton/mlton/releases/download/on-20241230-release/mlton-20241230-1.arm64-linux.ubuntu-24.04-arm_glibc2.39.tgz
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev gcc make
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/mlton.tgz" "$MLTON_URL"
          mkdir -p "$RUNNER_TEMP/mlton"
          tar -xzf "$RUNNER_TEMP/mlton.tgz" -C "$RUNNER_TEMP/mlton" --strip-components=1
          for t in mlton mllex mlyacc; do
            if [ ! -x "$RUNNER_TEMP/mlton/bin/$t" ]; then
              echo "::error::no bin/$t in MLton's release archive; its layout:"
              find "$RUNNER_TEMP/mlton" -maxdepth 2 | head -40
              exit 1
            fi
          done
          echo "$RUNNER_TEMP/mlton/bin" >> "$GITHUB_PATH"

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: common/build.sh '${{ matrix.ref }}' ".builds/${{ steps.ref.outputs.commit }}"

      - name: Upload the build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.ref }}-${{ matrix.os }}
          path: .builds/*.build.log
          if-no-files-found: ignore

  build-macos:
    name: build all (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout the pack
        uses: actions/checkout@v4

      - name: Find the image
        id: ref
        run: echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      # One cache for the six builds. After a change of common/refs.sh the previous cache is restored and
      # build.sh rebuilds only the commits that are not in it.
      - name: Cache the builds
        id: cache
        uses: actions/cache@v4
        with:
          path: .builds
          key: mpl-macos-latest-${{ steps.ref.outputs.image }}-${{ runner.arch }}-${{ hashFiles('common/refs.sh') }}
          restore-keys: |
            mpl-macos-latest-${{ steps.ref.outputs.image }}-${{ runner.arch }}-

      - name: Install dependencies (macOS, as upstream's README)
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install mlton make gmp

      - name: Build every commit, one after the other
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          . common/refs.sh
          for n in base weak weak0 hint main ebr; do
            JOBS=3 common/build.sh "$n" ".builds/$(ref_commit "$n")"
          done

      - name: Upload the build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-macos-latest
          path: .builds/*.build.log
          if-no-files-found: ignore

  finding:
    name: ${{ matrix.finding }} (${{ matrix.os }})
    needs: build
    # run even if a build failed: each platform's jobs check for the builds they need
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.os == 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        finding: [stale-suspects, parallel-clear, heap-placement, ebr-false-sharing, write-barrier-depth]
        include:
          - finding: stale-suspects
            builds: base weak
          - finding: parallel-clear
            builds: base weak
          - finding: heap-placement
            builds: hint
          - finding: ebr-false-sharing
            builds: main ebr weak0 weak
          - finding: write-barrier-depth
            builds: main
    steps:
      - name: Checkout the pack
        uses: actions/checkout@v4

      - name: Find the commits
        id: ref
        run: |
          . common/refs.sh
          for n in base weak weak0 hint main ebr; do echo "$n=$(ref_commit $n)" >> "$GITHUB_OUTPUT"; done
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore build base
        if: contains(format(' {0} ', matrix.builds), ' base ')
        uses: actions/cache/restore@v4
        with:
          path: .builds/${{ steps.ref.outputs.base }}
          key: mpl-${{ matrix.os }}-${{ steps.ref.outputs.image }}-${{ runner.arch }}-${{ steps.ref.outputs.base }}

      - name: Restore build weak
        if: contains(format(' {0} ', matrix.builds), ' weak ')
        uses: actions/cache/restore@v4
        with:
          path: .builds/${{ steps.ref.outputs.weak }}
          key: mpl-${{ matrix.os }}-${{ steps.ref.outputs.image }}-${{ runner.arch }}-${{ steps.ref.outputs.weak }}

      - name: Restore build weak0
        if: contains(format(' {0} ', matrix.builds), ' weak0 ')
        uses: actions/cache/restore@v4
        with:
          path: .builds/${{ steps.ref.outputs.weak0 }}
          key: mpl-${{ matrix.os }}-${{ steps.ref.outputs.image }}-${{ runner.arch }}-${{ steps.ref.outputs.weak0 }}

      - name: Restore build hint
        if: contains(format(' {0} ', matrix.builds), ' hint ')
        uses: actions/cache/restore@v4
        with:
          path: .builds/${{ steps.ref.outputs.hint }}
          key: mpl-${{ matrix.os }}-${{ steps.ref.outputs.image }}-${{ runner.arch }}-${{ steps.ref.outputs.hint }}

      - name: Restore build main
        if: contains(format(' {0} ', matrix.builds), ' main ')
        uses: actions/cache/restore@v4
        with:
          path: .builds/${{ steps.ref.outputs.main }}
          key: mpl-${{ matrix.os }}-${{ steps.ref.outputs.image }}-${{ runner.arch }}-${{ steps.ref.outputs.main }}

      - name: Restore build ebr
        if: contains(format(' {0} ', matrix.builds), ' ebr ')
        uses: actions/cache/restore@v4
        with:
          path: .builds/${{ steps.ref.outputs.ebr }}
          key: mpl-${{ matrix.os }}-${{ steps.ref.outputs.image }}-${{ runner.arch }}-${{ steps.ref.outputs.ebr }}

      - name: Check that the builds are there
        run: |
          . common/refs.sh
          for n in ${{ matrix.builds }}; do
            if [ ! -x ".builds/$(ref_commit "$n")/bin/mpl" ]; then
              echo "::error::build $n is missing on ${{ matrix.os }} (its build job failed, or the cache was not saved)"
              exit 1
            fi
          done

      - name: Install what compiled programs need
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev gcc make binutils

      - name: Run
        run: |
          echo "cores: $(getconf _NPROCESSORS_ONLN); $(uname -srm)"
          ./${{ matrix.finding }}/run.sh

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.finding }}-${{ matrix.os }}
          path: |
            ${{ matrix.finding }}/out/results.md
            ${{ matrix.finding }}/out/results.tsv
            ${{ matrix.finding }}/out/runs.tsv
            ${{ matrix.finding }}/out/crashes.txt
            ${{ matrix.finding }}/out/runs/
          if-no-files-found: warn

  findings-macos:
    name: all findings (macos-latest)
    needs: build-macos
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout the pack
        uses: actions/checkout@v4

      - name: Find the image
        id: ref
        run: echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore the builds
        uses: actions/cache/restore@v4
        with:
          path: .builds
          key: mpl-macos-latest-${{ steps.ref.outputs.image }}-${{ runner.arch }}-${{ hashFiles('common/refs.sh') }}
          fail-on-cache-miss: true

      - name: Check that the builds are there
        run: |
          . common/refs.sh
          for n in base weak weak0 hint main ebr; do
            if [ ! -x ".builds/$(ref_commit "$n")/bin/mpl" ]; then
              echo "::error::build $n is missing on macos-latest"
              exit 1
            fi
          done

      - name: Install what compiled programs need
        id: deps
        run: brew install gmp

      - name: Run stale-suspects
        run: ./stale-suspects/run.sh

      - name: Run parallel-clear
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ./parallel-clear/run.sh

      - name: Run heap-placement
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ./heap-placement/run.sh

      - name: Run ebr-false-sharing
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ./ebr-false-sharing/run.sh

      - name: Run write-barrier-depth
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ./write-barrier-depth/run.sh

      - name: Upload the results of stale-suspects
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: results-stale-suspects-macos-latest
          path: |
            stale-suspects/out/results.md
            stale-suspects/out/results.tsv
            stale-suspects/out/runs.tsv
            stale-suspects/out/crashes.txt
            stale-suspects/out/runs/
          if-no-files-found: warn

      - name: Upload the results of parallel-clear
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: results-parallel-clear-macos-latest
          path: |
            parallel-clear/out/results.md
            parallel-clear/out/results.tsv
            parallel-clear/out/runs.tsv
            parallel-clear/out/crashes.txt
            parallel-clear/out/runs/
          if-no-files-found: warn

      - name: Upload the results of heap-placement
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: results-heap-placement-macos-latest
          path: |
            heap-placement/out/results.md
            heap-placement/out/results.tsv
            heap-placement/out/runs.tsv
            heap-placement/out/crashes.txt
            heap-placement/out/runs/
          if-no-files-found: warn

      - name: Upload the results of ebr-false-sharing
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: results-ebr-false-sharing-macos-latest
          path: |
            ebr-false-sharing/out/results.md
            ebr-false-sharing/out/results.tsv
            ebr-false-sharing/out/runs.tsv
            ebr-false-sharing/out/crashes.txt
            ebr-false-sharing/out/runs/
          if-no-files-found: warn

      - name: Upload the results of write-barrier-depth
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: results-write-barrier-depth-macos-latest
          path: |
            write-barrier-depth/out/results.md
            write-barrier-depth/out/results.tsv
            write-barrier-depth/out/runs.tsv
            write-barrier-depth/out/crashes.txt
            write-barrier-depth/out/runs/
          if-no-files-found: warn

  combine:
    name: results by platform
    needs: [finding, findings-macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the pack
        uses: actions/checkout@v4

      - name: Download every platform's results
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: all-results

      - name: One table per finding, one column per platform
        run: common/combine.sh all-results all-results/combined.md

      - name: Upload the combined table
        uses: actions/upload-artifact@v4
        with:
          name: results-combined
          path: all-results/combined.md
